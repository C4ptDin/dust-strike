<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Dust Strike 2D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap">
<style>
:root{--bg:#101316;--fg:#e8edf2;--ac:#ff9340;--ct:#4aa3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101316;--fg:#e8edf2}}
:root[data-theme="dark"]{--bg:#101316;--fg:#e8edf2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Rajdhani","Trebuchet MS",sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:10px}
#wrap{position:relative;width:100%;max-width:960px}
canvas{display:block;width:100%;height:auto;border:2px solid #2c343c;cursor:crosshair}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,14,.9);text-align:center;padding:16px}
h1{font-size:clamp(36px,7vw,68px);margin:0;letter-spacing:3px}
#ov p{margin:6px 0;font-size:clamp(15px,2.3vw,21px);max-width:560px;line-height:1.35;color:#aab4bf}
#maps,#modes{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
button{font:700 20px "Rajdhani",sans-serif;background:#1c2228;color:var(--fg);border:2px solid #2c343c;padding:10px 26px;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)}
#modes button{background:var(--ac);color:#101316;border-color:var(--ac)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#help{margin-top:8px;font-size:17px;color:#8f9aa6;text-align:center}
#flow{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;margin-top:14px}
#flow .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#flow .card{width:min(250px,44vw);padding:14px 16px;text-align:center;line-height:1.15}
#flow .card small{display:block;margin-top:5px;font:500 15px "Rajdhani",sans-serif;color:#8f9aa6}
#flow .card:hover,#flow .card:focus-visible{border-color:var(--ac)}
#flow .card canvas{border:0;margin-bottom:8px;cursor:pointer}
#flow input{font:700 22px "Rajdhani",sans-serif;background:#1c2228;color:var(--fg);border:2px solid #2c343c;padding:10px 14px;text-align:center;width:min(300px,80vw)}
#flow .back{font-size:16px;padding:6px 18px}
#pb{position:absolute;top:10px;right:12px;display:none;padding:4px 16px;font-size:16px;z-index:2}
#pz{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,12,14,.88);z-index:3;text-align:center;padding:16px}
#pz p{margin:0 0 8px;color:#aab4bf;max-width:420px;font-size:19px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="g" width="960" height="640"></canvas>
<div id="ov">
<h1 id="t">Dust Strike</h1>
<p id="m">Game tactical 2D pandangan atas. Pilih peta dan mod.</p>
<div id="flow"></div>
<p id="st"></p>
</div>
<button id="pb" aria-label="Jeda permainan">Jeda</button>
<div id="pz"><h1>Jeda</h1><p id="pzn"></p><button class="on" id="pr">Sambung</button><button id="pq">Keluar</button></div>
</div>
<div id="help">W A S D gerak. Tetikus bidik dan tembak. R isi semula. B buka kedai beli (nombor 1-6 senjata, 7 perisai). Esc atau P untuk jeda.</div>
<script>
const $=i=>document.getElementById(i),c=$('g'),x=c.getContext('2d'),W=960,H=640;
const BW=[[0,0,W,16],[0,H-16,W,16],[0,0,16,H],[W-16,0,16,H]];
const MAPS=[
{n:'Dust',f:'#2a2620',w:'#4f4535',e:'#85735a',s:[[200,120,40,200],[200,430,40,110],[400,190,140,40],[400,410,140,40],[480,230,40,60],[480,370,40,40],[720,110,40,170],[720,360,40,170],[320,290,60,60],[600,40,40,90],[600,510,40,90],[100,560,90,24],[100,60,90,24],[840,300,60,40]]},
{n:'Bunker',f:'#182028',w:'#3a4654',e:'#6f8196',s:[[240,16,30,200],[240,300,30,160],[240,540,30,84],[480,16,30,120],[480,220,30,200],[480,500,30,124],[720,16,30,180],[720,280,30,160],[720,520,30,104],[330,100,60,30],[330,500,60,30],[600,300,40,40],[820,120,60,30],[100,120,60,30],[100,500,60,30]]},
{n:'Yard',f:'#1b2a20',w:'#4a5a3e',e:'#7f9468',s:[[300,100,60,60],[300,480,60,60],[450,290,60,60],[620,100,60,60],[620,480,60,60],[180,290,40,60],[740,290,40,60],[380,200,30,30],[540,410,30,30],[380,410,30,30],[540,200,30,30],[860,180,40,40],[860,420,40,40],[60,180,40,40],[60,420,40,40]]}];
const WP=[
{n:'USP',p:0,d:22,r:.2,m:12,rs:48,sp:.03,rl:1.1,v:200},
{n:'MP5',p:1200,d:17,r:.075,m:30,rs:90,sp:.1,rl:1.5,v:195,a:1},
{n:'Pump',p:1800,d:11,r:.85,m:6,rs:24,sp:.2,pl:8,rl:2,v:190},
{n:'AK-47',p:2700,d:27,r:.1,m:30,rs:90,sp:.06,rl:1.8,v:180,a:1},
{n:'AWP',p:4750,d:100,r:1.3,m:5,rs:20,sp:.004,rl:2.4,v:165},
{n:'M249',p:5200,d:24,r:.07,m:100,rs:100,sp:.12,rl:3.4,v:150,a:1}];
let walls=BW,map=0,mode='sp',state='menu',round=0,bots=[],tr=[],fx=[],banner=0,rt=1.5,hurtT=0,mx=W/2,my=H/2,down=false,fresh=false,lastHp=100;
let paused=false,R=null,peerList=[],ghosts={},pt=0,st0=0;const keys={};
const P={x:80,y:320,hp:100,ar:0,mo:800,w:0,own:[],am:[],rs:[],rl:0,cd:0,a:0,buy:0,k:0,dd:0,alive:true,rt:0,tm:0,hb:false,name:'Pemain '+(100+Math.random()*900|0)};

// geometry
function segRect(ax,ay,bx,by,r){const dx=bx-ax,dy=by-ay;let t0=0,t1=1;
 for(const[p,q]of[[-dx,ax-r[0]],[dx,r[0]+r[2]-ax],[-dy,ay-r[1]],[dy,r[1]+r[3]-ay]]){
  if(p===0){if(q<0)return Infinity}else{const t=q/p;if(p<0){if(t>t1)return Infinity;if(t>t0)t0=t}else{if(t<t0)return Infinity;if(t<t1)t1=t}}}
 return t0}
function wallHit(ax,ay,bx,by){let m=Infinity;for(const w of walls){const t=segRect(ax,ay,bx,by,w);if(t<m)m=t}return m}
function rayCircle(ox,oy,dx,dy,cx,cy,r){const px=cx-ox,py=cy-oy,t=px*dx+py*dy;if(t<0)return Infinity;const d2=px*px+py*py-t*t;if(d2>r*r)return Infinity;return t-Math.sqrt(r*r-d2)}
function push(e,r){for(const w of walls){const nx=Math.max(w[0],Math.min(e.x,w[0]+w[2])),ny=Math.max(w[1],Math.min(e.y,w[1]+w[3]));
 const dx=e.x-nx,dy=e.y-ny,d=Math.hypot(dx,dy);if(d<r){if(d===0){e.y-=r;continue}e.x=nx+dx/d*r;e.y=ny+dy/d*r}}}
const inWall=e=>walls.some(w=>e.x>w[0]-16&&e.x<w[0]+w[2]+16&&e.y>w[1]-16&&e.y<w[1]+w[3]+16);
function spawn(tm){const e={};do{e.x=(tm?830:50)+Math.random()*80;e.y=40+Math.random()*560}while(inWall(e));return e}
const sees=(ax,ay,bx,by)=>!(wallHit(ax,ay,bx,by)<1);
function fire(o,a,tg,col){const dx=Math.cos(a),dy=Math.sin(a),L=900;let best=Math.min(wallHit(o.x,o.y,o.x+dx*L,o.y+dy*L)*L,L),hit=null;
 for(const t of tg){const d=rayCircle(o.x,o.y,dx,dy,t.x,t.y,14);if(d<best){best=d;hit=t}}
 const T=[o.x+dx*18,o.y+dy*18,o.x+dx*best,o.y+dy*best];tr.push({T,l:.08,col});return{hit,T}}

// player state
function resetPlayer(){P.own=[1,0,0,0,0,0];P.am=WP.map(w=>w.m);P.rs=WP.map(w=>w.rs);P.w=0;P.mo=800;P.hp=100;P.ar=0;P.k=0;P.dd=0;P.alive=true;P.rl=0;P.cd=0}
function hurt(d){const a=Math.min(P.ar,d*.5);P.ar-=a;P.hp-=d-a}
function reload(){const w=WP[P.w];if(P.rl>0||P.am[P.w]>=w.m||P.rs[P.w]<=0)return;P.rl=w.rl}
function buy(i){
 if(i===6){if(P.buy>0&&P.mo>=650&&P.ar<100){P.mo-=650;P.ar=100}return}
 if(P.own[i]){P.w=i;P.rl=0;return}
 if(P.buy>0&&P.mo>=WP[i].p){P.mo-=WP[i].p;P.own[i]=1;P.am[i]=WP[i].m;P.rs[i]=WP[i].rs;P.w=i;P.rl=0}}

// single player
let mates=[];
const BP=[{dm:10,cb:.95,sm:1,rg:620},{dm:5,cb:.3,sm:1.3,rg:620},{dm:13,cb:1.3,sm:1.5,rg:360},{dm:8,cb:.42,sm:1,rg:620},{dm:45,cb:1.9,sm:.25,rg:620},{dm:4.5,cb:.22,sm:1.8,rg:620}];
let eco;
function ecoInit(){eco={m:{mo:Array(4).fill(800),w:Array(4).fill(0)},e:{mo:Array(10).fill(800),w:Array(10).fill(0)}}}
function ecoBuy(g,alive,bonus){for(let s=0;s<g.mo.length;s++){if(!alive.has(s))g.w[s]=0;g.mo[s]+=bonus;
 if(!g.w[s]){const aff=[];WP.forEach((q,i)=>{if(i&&q.p<=g.mo[s])aff.push(i)});
  if(aff.length){const i=aff[aff.length-1-(aff.length>1&&Math.random()<.35?1:0)];g.w[s]=i;g.mo[s]-=WP[i].p}}}}
const mkBot=(tm,hp,g,s)=>{const p=spawn(tm),wi=eco[g].w[s],q=BP[wi];return{x:p.x,y:p.y,hp:hp,mh:hp,cd:.8+Math.random()*.8,off:0,ht:0,a:tm?Math.PI:0,fl:0,sp:(75+round*4)*WP[wi].v/190,dir:Math.random()<.5?1:-1,g:g,s:s,wi:wi,dm:q.dm,cb:q.cb,sm:q.sm,rg:q.rg}};
function startRound(){
 round++;const n=Math.min(4+round,10);ecoBuy(eco.m,new Set(mates.map(m=>m.s)),round>1?1500:0);ecoBuy(eco.e,new Set(bots.map(b=>b.s)),round>1?1400:0);bots=[];mates=[];
 for(let i=0;i<n;i++)bots.push(mkBot(1-P.tm,70,'e',i));
 for(let i=0;i<4;i++)mates.push(mkBot(P.tm,100,'m',i));
 const s=spawn(P.tm);P.x=s.x;P.y=s.y;P.hp=Math.min(100,P.hp+25);P.buy=8;banner=2;
 P.am=WP.map((w,i)=>P.own[i]?w.m:0);P.rs=WP.map((w,i)=>P.own[i]?w.rs:0)}
function botAct(b,foes,dt,col){
 b.fl-=dt;b.cd-=dt;b.ht-=dt;if(P.buy>0||!foes.length)return;
 let f=foes[0],dm=1e9;for(const o of foes){const q=Math.hypot(o.x-b.x,o.y-b.y);if(q<dm){dm=q;f=o}}
 const d=dm,a=Math.atan2(f.y-b.y,f.x-b.x),see=d<620&&sees(b.x,b.y,f.x,f.y);let hd=a;
 if(see&&d<300)hd=a+b.dir*Math.PI/2;else if(b.ht>0)hd=a+b.off;
 const ox=b.x,oy=b.y;
 if(!(see&&d<170)){b.x+=Math.cos(hd)*b.sp*dt;b.y+=Math.sin(hd)*b.sp*dt;push(b,14)}
 if(!see&&Math.hypot(b.x-ox,b.y-oy)<b.sp*dt*.35&&b.ht<=0){b.off=(Math.random()<.5?-1:1)*(1+Math.random()*1.2);b.ht=.7}
 if(Math.random()<dt*.3)b.dir*=-1;
 if(see){b.a=a;if(b.cd<=0&&d<=b.rg){b.cd=b.cb*(.8+Math.random()*.5);const sp=(Math.random()-.5)*.22*b.sm*(1+d/350),r=fire(b,a+sp,[f],col);if(r.hit){if(f===P)hurt(b.dm);else{f.hp-=b.dm;f.fl=.1;if(f.hp<=0&&!f.cr){f.cr=1;eco[b.g].mo[b.s]+=300}}}}}else b.a=hd}
function botsUpdate(dt){
 const fr=(P.alive?[P]:[]).concat(mates);
 for(const b of bots)botAct(b,fr,dt,'#ffb35c');
 for(const m of mates)botAct(m,bots,dt,'#9fd3ff');
 bots=bots.filter(b=>{if(b.hp<=0){if(b.by){P.k++;P.mo+=300}return false}return true});
 mates=mates.filter(m=>m.hp>0);
 if(P.hp<=0){P.alive=false;menu('Anda tewas','Sampai pusingan '+round+' dengan '+P.k+' kill.')}
 if(!bots.length&&P.alive){rt-=dt;if(rt<=0){P.mo+=1500;startRound();rt=1.5}}else rt=1.5}

// multiplayer
async function joinMP(){
 try{if(!window.claude)throw 0;const r=await claude.use('room');if(!r)throw 0;R=await r.join('ds-'+MAPS[map].n+'-'+sel.mode)}
 catch(e){$('st').textContent='Multiplayer hanya berfungsi pada halaman yang diterbitkan dan dibuka dalam claude.ai.';return false}
 const me=()=>(peerList.find(p=>p.isMe)||{}).peer;
 R.onPeers(ch=>{peerList=ch.peers});
 R.on('shot',m=>{if(!m.isMe&&Array.isArray(m.data))tr.push({T:m.data,l:.08,col:'#ffd08a'})});
 R.on('hit',m=>{const d=m.data||{};if(d.to!==me()||!P.alive||state!=='play')return;hurt(Math.min(150,+d.d||0));
  if(P.hp<=0){P.alive=false;P.dd++;P.rt=3;R.emit('kill',{by:d.by}).catch(()=>{})}});
 R.on('kill',m=>{if((m.data||{}).by===me()){P.k++;P.mo+=300}});
 P.tm=sel.team;return true}
function respawn(){const s=spawn(P.tm);P.x=s.x;P.y=s.y;P.hp=100;P.ar=0;P.alive=true;P.buy=10;P.am=WP.map((w,i)=>P.own[i]?w.m:0);P.rs=WP.map((w,i)=>P.own[i]?w.rs:0)}
function mpUpdate(dt){
 const ids={};
 for(const p of peerList){if(p.isMe)continue;const s=p.presence||{};ids[p.peer]=1;
  const g=ghosts[p.peer]||(ghosts[p.peer]={x:+s.x||0,y:+s.y||0,id:p.peer});
  g.x+=((+s.x||0)-g.x)*Math.min(1,dt*14);g.y+=((+s.y||0)-g.y)*Math.min(1,dt*14);g.a=+s.a||0;g.hp=+s.hp||0;g.tm=s.tm;g.al=s.al;g.n=String(s.n||'');g.k=+s.k||0;g.dd=+s.dd||0}
 for(const id in ghosts)if(!ids[id])delete ghosts[id];
 pt-=dt;if(pt<=0&&R){pt=.08;R.presence({x:Math.round(P.x),y:Math.round(P.y),a:+P.a.toFixed(2),hp:Math.round(P.hp),tm:P.tm,k:P.k,dd:P.dd,al:P.alive?1:0,n:P.name}).catch(()=>{})}
 if(!P.alive){P.rt-=dt;if(P.rt<=0)respawn()}}
const targets=()=>mode==='sp'?bots:Object.values(ghosts).filter(g=>g.al&&g.tm!==P.tm);

// flow
function menu(t,m){state='menu';$('pb').style.display='none';$('t').textContent=t;$('m').textContent=m;$('ov').style.display='flex';if(R){R.leave().catch(()=>{});R=null;peerList=[];ghosts={}}}
async function begin(md){
 mode=md;walls=BW.concat(MAPS[map].s);$('st').textContent='';resetPlayer();bots=[];mates=[];tr=[];fx=[];round=0;
 if(md==='mp'){$('st').textContent='Menyambung...';if(!await joinMP())return;respawn()}else{P.tm=sel.team;ecoInit();startRound()}
 state='play';paused=false;$('pz').style.display='none';$('pb').style.display='block';$('ov').style.display='none'}

// pause
function setPause(on){if(on===paused||(on&&state!=='play'))return;paused=on;$('pz').style.display=on?'flex':'none';
 $('pzn').textContent=mode==='mp'?'Multiplayer tidak berhenti. Anda kekal di tempat dan boleh diserang.':'Permainan dihentikan.';
 if(on){for(const k in keys)keys[k]=0;down=false}if(mode==='sp')state=on?'pause':'play'}

// input
addEventListener('keydown',e=>{if(!paused)keys[e.code]=1;
 if((e.code==='Escape'||e.code==='KeyP')&&(state==='play'||state==='pause')){setPause(!paused);return}
 if(state!=='play')return;
 if(e.code==='KeyR')reload();if(e.code==='KeyB')P.hb=!P.hb;
 const n=+e.key;if(n>=1&&n<=7&&P.alive)buy(n-1)});
addEventListener('keyup',e=>keys[e.code]=0);
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height});
c.addEventListener('mousedown',()=>{down=true;fresh=true});addEventListener('mouseup',()=>down=false);
c.addEventListener('contextmenu',e=>e.preventDefault());

function update(dt){
 const fz=mode==='sp'&&P.buy>0;P.buy=Math.max(0,P.buy-dt);banner-=dt;
 if(P.alive){
  const w=WP[P.w];let vx=(keys.KeyD?1:0)-(keys.KeyA?1:0),vy=(keys.KeyS?1:0)-(keys.KeyW?1:0);
  if((vx||vy)&&!fz){const m=Math.hypot(vx,vy);P.x+=vx/m*w.v*dt;P.y+=vy/m*w.v*dt;push(P,14)}
  P.a=Math.atan2(my-P.y,mx-P.x);P.cd-=dt;
  if(P.rl>0){P.rl-=dt;if(P.rl<=0){const n=Math.min(w.m-P.am[P.w],P.rs[P.w]);P.am[P.w]+=n;P.rs[P.w]-=n}}
  if(down&&!fz&&P.cd<=0&&P.rl<=0&&(w.a||fresh)){
   if(P.am[P.w]>0){fresh=false;P.am[P.w]--;P.cd=w.r;const sums={};let first=null;
    for(let i=0;i<(w.pl||1);i++){const r=fire(P,P.a+(Math.random()-.5)*2*w.sp,targets(),'#9fd3ff');if(!first)first=r.T;
     if(r.hit){if(mode==='sp'){r.hit.hp-=w.d;r.hit.by=1;r.hit.fl=.1;fx.push({x:r.hit.x,y:r.hit.y,l:.25})}else sums[r.hit.id]=(sums[r.hit.id]||0)+w.d}}
    if(mode==='mp'&&R){R.emit('shot',first.map(Math.round)).catch(()=>{});for(const id in sums)R.emit('hit',{to:id,d:sums[id],by:(peerList.find(p=>p.isMe)||{}).peer}).catch(()=>{})}
    fx.push({x:P.x+Math.cos(P.a)*24,y:P.y+Math.sin(P.a)*24,l:.05,m:1})}
   else reload()}}
 if(mode==='sp')botsUpdate(dt);else mpUpdate(dt);
 for(const t of tr)t.l-=dt;tr=tr.filter(t=>t.l>0);for(const f of fx)f.l-=dt;fx=fx.filter(f=>f.l>0);hurtT=Math.max(0,hurtT-dt*1.5)}

// render
function person(o,col,hp){
 x.save();x.translate(o.x,o.y);x.rotate(o.a);x.fillStyle='#10161c';x.fillRect(6,-4,24,8);
 x.fillStyle=col;x.beginPath();x.arc(0,0,14,0,7);x.fill();x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.arc(4,0,6,0,7);x.fill();x.restore();
 if(hp!=null){x.fillStyle='#000';x.fillRect(o.x-16,o.y-27,32,4);x.fillStyle='#ff5a3c';x.fillRect(o.x-16,o.y-27,32*Math.max(0,hp/100),4)}}
function draw(){
 const M=MAPS[map];x.fillStyle=M.f;x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(255,255,255,.045)';x.lineWidth=1;
 for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
 for(let j=0;j<H;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
 for(const w of walls){x.fillStyle='rgba(0,0,0,.35)';x.fillRect(w[0]+4,w[1]+5,w[2],w[3]);x.fillStyle=M.w;x.fillRect(w[0],w[1],w[2],w[3]);x.fillStyle=M.e;x.fillRect(w[0],w[1],w[2],3)}
 const vis=o=>Math.hypot(P.x-o.x,P.y-o.y)<70||(Math.hypot(P.x-o.x,P.y-o.y)<520&&sees(P.x,P.y,o.x,o.y));
 const ec=P.tm?'#4aa3ff':'#ff9340',mc=P.tm?'#ff9340':'#4aa3ff';
 const lab=o=>{x.fillStyle='#e8edf2';x.font='600 14px Rajdhani';x.textAlign='center';x.textBaseline='bottom';x.fillText(WP[o.wi].n,o.x,o.y-29);x.textAlign='left'};
 if(mode==='sp'){for(const b of bots)if(vis(b)){person(b,b.fl>0?'#fff':ec,b.hp/b.mh*100);lab(b)}for(const m of mates){person(m,m.fl>0?'#fff':mc,m.hp/m.mh*100);lab(m)}}
 if(mode==='mp')for(const g of Object.values(ghosts))if(g.al&&vis(g)){person(g,g.tm?'#ff9340':'#4aa3ff',g.hp);x.fillStyle='#e8edf2';x.font='600 14px Rajdhani';x.textAlign='center';x.fillText(g.n,g.x,g.y-32);x.textAlign='left'}
 for(const t of tr){x.globalAlpha=Math.min(1,t.l/.08);x.strokeStyle=t.col;x.lineWidth=2;x.beginPath();x.moveTo(t.T[0],t.T[1]);x.lineTo(t.T[2],t.T[3]);x.stroke();x.globalAlpha=1}
 for(const f of fx){x.fillStyle=f.m?'#fff3b0':'#c0392b';x.beginPath();x.arc(f.x,f.y,f.m?9:7+f.l*20,0,7);x.fill()}
 if(P.alive){person({x:P.x,y:P.y,a:P.a},P.tm?'#ff9340':'#4aa3ff');
  x.beginPath();x.rect(0,0,W,H);x.moveTo(P.x+520,P.y);for(let i=1;i<=180;i++){const a=i/180*6.2832,t=wallHit(P.x,P.y,P.x+Math.cos(a)*520,P.y+Math.sin(a)*520),d=Math.min(520,t*520);x.lineTo(P.x+Math.cos(a)*d,P.y+Math.sin(a)*d)}
  x.closePath();x.fillStyle='rgba(4,6,8,.62)';x.fill('evenodd')}
 else{x.fillStyle='rgba(4,6,8,.55)';x.fillRect(0,0,W,H)}
 x.strokeStyle='#e8edf2';x.lineWidth=2;x.beginPath();x.moveTo(mx-10,my);x.lineTo(mx-4,my);x.moveTo(mx+4,my);x.lineTo(mx+10,my);x.moveTo(mx,my-10);x.lineTo(mx,my-4);x.moveTo(mx,my+4);x.lineTo(mx,my+10);x.stroke();
 if(P.hp<lastHp)hurtT=.6;lastHp=P.hp;if(hurtT>0){x.fillStyle='rgba(200,30,20,'+hurtT*.4+')';x.fillRect(0,0,W,H)}
 hud()}
function hud(){
 const w=WP[P.w];x.textBaseline='top';x.font='700 24px Rajdhani, sans-serif';
 x.fillStyle='rgba(8,10,12,.75)';x.fillRect(20,H-66,260,50);x.fillRect(W-300,H-66,280,50);x.fillRect(W/2-210,22,420,34);
 x.fillStyle='#2a323a';x.fillRect(30,H-54,140,12);x.fillStyle=P.hp>35?'#6fd16f':'#ff5a3c';x.fillRect(30,H-54,140*Math.max(0,P.hp)/100,12);
 x.fillStyle='#4aa3ff';x.fillRect(30,H-38,140*P.ar/100,6);
 x.fillStyle='#e8edf2';x.fillText(Math.max(0,Math.ceil(P.hp)),180,H-61);x.fillStyle='#8fd18f';x.fillText('$'+P.mo,215,H-61);
 x.fillStyle='#e8edf2';x.fillText(w.n+'   '+(P.rl>0?'Isi semula':P.am[P.w]+' / '+P.rs[P.w]),W-290,H-61);
 x.textAlign='center';x.fillText(mode==='sp'?'Pusingan '+round+'   Kill '+P.k+'   Musuh '+bots.length+'   Rakan '+mates.length:'Kill '+P.k+'   Mati '+P.dd,W/2,27);
 x.font='700 40px Rajdhani, sans-serif';
 if(!P.alive&&mode==='mp')x.fillText('Bangkit dalam '+Math.ceil(P.rt),W/2,H/2-30);
 else if(mode==='sp'&&!bots.length)x.fillText('Pusingan selesai',W/2,H/2-30);
 else if(P.buy>0)x.fillText('Fasa beli: '+Math.ceil(P.buy)+(mode==='sp'?' (belum bermula)':''),W/2,70);
 else if(banner>0)x.fillText('Pusingan '+round,W/2,H/2-30);
 x.textAlign='left';x.font='600 18px Rajdhani, sans-serif';
 if(mode==='mp'){const L=[{n:P.name+' (anda)',k:P.k,d:P.dd,t:P.tm},...Object.values(ghosts).map(g=>({n:g.n,k:g.k,d:g.dd,t:g.tm}))].sort((a,b)=>b.k-a.k).slice(0,6);
  L.forEach((p,i)=>{x.fillStyle=p.t?'#ff9340':'#4aa3ff';x.fillText(p.n+'  '+p.k+'/'+p.d,26,26+i*20)})}
 if(P.buy>0&&!P.hb&&P.alive){x.fillStyle='rgba(8,10,12,.88)';x.fillRect(W-310,90,290,250);x.font='700 20px Rajdhani, sans-serif';
  WP.forEach((q,i)=>{x.fillStyle=P.own[i]?'#8fd18f':P.mo>=q.p?'#e8edf2':'#6b7580';x.fillText((i+1)+'  '+q.n,W-296,102+i*30);x.fillText(P.own[i]?'dimiliki':'$'+q.p,W-120,102+i*30)});
  x.fillStyle=P.mo>=650?'#e8edf2':'#6b7580';x.fillText('7  Perisai',W-296,102+180);x.fillText('$650',W-120,102+180);x.fillStyle='#8f9aa6';x.fillText('B tutup panel',W-296,102+215)}}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(state==='play')update(dt);if(state==='play'||st0++<2)draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
<script>
/* ===== Flow: Start > Mod > Pasukan > Peta ===== */
const sel={name:'',play:'sp',mode:'classic',team:0};
let logged=false;
const MODES=[
 {id:'classic',n:'5 vs 5 Classic',s:'Pasukan lawan pasukan. Kill terbanyak menang.'},
 {id:'bomb',n:'5 vs 5 Bomb Mode',s:'Misi tanam dan lucut bom.'}];
const TEAMS=[
 {n:'Police',s:'Unit taktikal penguatkuasa undang-undang',c:'#4aa3ff'},
 {n:'Thieves',s:'Sindiket rompakan bersenjata',c:'#ff9340'}];
function el(tag,cls,txt,fn){const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;if(fn)e.onclick=fn;return e}
function card(n,s,fn,col){const b=el('button','card',n,fn);b.appendChild(el('small','',s));if(col)b.style.borderColor=col;return b}
function preview(i){const M=MAPS[i],cv=el('canvas');cv.width=240;cv.height=160;const g=cv.getContext('2d'),k=.25;
 g.fillStyle=M.f;g.fillRect(0,0,240,160);
 for(const w of BW.concat(M.s)){g.fillStyle=M.w;g.fillRect(w[0]*k,w[1]*k,w[2]*k,w[3]*k);g.fillStyle=M.e;g.fillRect(w[0]*k,w[1]*k,w[2]*k,1)}
 g.fillStyle='#4aa3ff';g.fillRect(14,76,8,8);g.fillStyle='#ff9340';g.fillRect(218,76,8,8);return cv}
function go(step,keep){
 const f=$('flow'),row=el('div','row');f.replaceChildren();
 const say=(t,m)=>{if(keep)return;$('t').textContent=t;$('m').textContent=m};
 const back=to=>f.appendChild(el('button','back','Kembali',()=>go(to)));
 if(step===1){say('Dust Strike','Masukkan nama anda untuk bermula.');
  const inp=el('input');inp.maxLength=16;inp.placeholder=P.name;inp.setAttribute('aria-label','Nama pemain');
  const ok=()=>{sel.name=inp.value.trim()||P.name;P.name=sel.name;logged=true;go(2)};
  inp.onkeydown=e=>{if(e.key==='Enter')ok()};f.append(inp,el('button','on','Start',ok))}
 else if(step===2){say('Dust Strike','Pilih cara bermain.');
  [['Single Player','Anda dan 4 rakan bot lawan 5 bot musuh.','sp'],['Multiplayer','Main online bersama pemain lain.','mp']].forEach(p=>row.appendChild(card(p[0],p[1],()=>{sel.play=p[2];go(3)})));f.appendChild(row)}
 else if(step===3){say('Dust Strike','Pilih mod permainan.');
  MODES.forEach(m=>row.appendChild(card(m.n,m.s,()=>{sel.mode=m.id;go(4)})));f.appendChild(row);back(2)}
 else if(step===4){say('Dust Strike','Pilih pasukan anda.');
  TEAMS.forEach((t,i)=>row.appendChild(card(t.n,t.s,()=>{sel.team=i;go(5)},t.c)));f.appendChild(row);back(3)}
 else{say('Dust Strike',sel.play==='sp'?'Pilih peta untuk lawan bot.':window.claude?'Pilih peta untuk masuk bilik online.':'Multiplayer hanya di claude.ai. Anda akan bermain lawan bot.');
  MAPS.forEach((m,i)=>{const c=card(m.n,'',()=>launch(i));c.prepend(preview(i));row.appendChild(c)});f.appendChild(row);back(4)}}
async function launch(i){map=i;if(sel.play==='mp'&&window.claude){await begin('mp');if(state!=='play')await begin('sp')}else await begin('sp')}
const _menu=menu;menu=function(t,m){_menu(t,m);go(logged?2:1,true)};
$('pb').onclick=()=>setPause(true);$('pr').onclick=()=>setPause(false);
$('pq').onclick=()=>{setPause(false);menu('Dust Strike','Pilih cara bermain.')};
go(1);
</script>
